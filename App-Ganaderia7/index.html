<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/img/style.css">
    <title>App-Ganadero</title>
</head>

<body>

    

    <header>
        <div class="logo">
            <img class="Logo-imagen" src="css/img/logop.jpg" width="80%" height="70%">
            <h2>De la semilla del campo, nace el alimento para la ciudad</h2>
        </div>

        <nav>
            <a href="" class="nav-link">Inicio</a>
            <a href="" class="nav-link">Sobre Nosotros</a>
            <a href="" class="nav-link">Contactos</a>
        </nav>   
    </header>
    

    <div class="row">
        <div class="col-md-6 mx-auto p-0">
            <div class="card">
                <div class="login-box">
                    <div class="login-snip">
                        <div class="inicio">
                            <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1"
                                class="tab">Ingresar</label>
                            <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2"
                                class="tab">Registrarse</label>
                            <div class="login-space">
                                <div class="login">
                                    <div class="group">
                                        <label for="user" class="label">Correo electronico</label>
                                        <input id="user" type="text" class="input" placeholder="E-mail" required>
                                    </div>
                                    <div class="group">
                                        <label for="pass" class="label">Contraseña</label>
                                        <input id="pass" type="password" class="input" data-type="password"
                                            placeholder="Contraseña" required>
                                    </div>
                                 
                                    <div class="group">
                                        <input type="submit" class="button" value="Iniciar sesión">
                                    </div>
                                    <div class="hr"></div>
                                    <div class="foot"><a href="#">Has olvidado tu contraseña?</a>
                                    </div>
                                </div>
                                <div class="sign-up-form">
                                    <div class="group">
                                        <label for="user" class="label">Nombre de usuario</label>
                                        <input id="user" type="text" class="input" placeholder="Nombre" required>
                                    </div>

                                    <div class="group">
                                        <label for="user" class="label">Seleccione N° Documento</label>
                                        <select type="documento" id="user" type="text" class="input" required>

                                            <option value="1">Cedula de Ciudadania</option>
                                            <option value="1">Tarjeta de identidad</option>
                                            <option value="1">Cedula extranjeria</option>
                                            <option value="1">Pasaporte</option>

                                            <input id="user" type="text" class="input" placeholder="N° del Documento"
                                                required />
                                        </select>
                                    </div>

                                    <div class="group">
                                        <label for="pass" class="label">Contraseña</label>
                                        <input id="pass" type="password" class="input" data-type="Contraseña"
                                            placeholder="Ingrese su contraseña" required>
                                    </div>
                                    <div class="group">
                                        <label for="pass" class="label">Verifica contraseña</label>
                                        <input id="pass" type="password" class="input" data-type="Contraseña"
                                            placeholder="Escriba contraseña">
                                    </div>
                                    <div class="group">
                                        <label for="pass" class="label">Correo electronico</label>
                                        <input id="pass" type="text" class="input" placeholder="Escribir el Correo">
                                    </div>
                                    <div class="group">
                                        <a href="Contenido.html"><input type="submit" class="button" value="Registrarse" required></a>
                                        <!-- <input type="submit" class="button" value="Registrarse" required> -->
                                    </div>
                                    <div class="hr"></div>
                                    <div class="foot">
                                        <label for="tab-1">¿Ya eres Usuario?</label>
                                    </div>



                                </div>

                                </header>
</body>

</html>
